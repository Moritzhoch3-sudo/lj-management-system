<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landjugend Scheuring | Vorstands-Zentrale</title>
    <meta name="description" content="Zentrales Verwaltungssystem für die Vorstandschaft der Landjugend Scheuring. Aufgaben-Verwaltung, Personen-Dashboard mit Prozentanzeigen, PIN-geschütztes Kassenbuch, Verträge & Audio-Sitzungstranskription.">
    
    <!-- HTTPS Enforcement Script -->
    <script>
        if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
            location.replace('https:' + location.href.substring(location.protocol.length));
        }
    </script>

    <!-- Security Meta Tags -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    
    <!-- Google Fonts: Plus Jakarta Sans & Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    
    <!-- Stylesheets with v54.2 Cache-Buster Query Tags -->
    <link rel="stylesheet" href="css/main.css?v=54.2">
    <link rel="stylesheet" href="css/components.css?v=54.2">
</head>
<body class="theme-donezo">
    <div class="app-layout">
        <!-- Modern Donezo Left Sidebar Navigation -->
        <aside class="app-sidebar">
            <div class="sidebar-header">
                <div class="d-flex align-items-center gap-2">
                    <div class="donezo-brand-badge" style="background: transparent; border: none; box-shadow: none;">
                        <img src="assets/wappen_scheuring.png" alt="Wappen Scheuring" class="brand-logo-wappen" />
                    </div>
                    <div class="brand-text">
                        <h1 class="brand-main-title">Vorstands-Zentrale</h1>
                        <span class="brand-sub">Landjugend Scheuring</span>
                    </div>
                </div>
                <div class="sidebar-header-right d-flex align-items-center gap-1.5">
                    <button type="button" class="mobile-user-chip" id="mobile-user-chip-btn" title="Vorstandsmitglied wechseln" aria-label="Vorstandsmitglied wechseln">
                        <span id="mobile-user-avatar" class="mobile-user-avatar" style="display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; overflow: hidden;">👱‍♂️</span>
                        <span id="mobile-user-name" class="mobile-user-name">Valentin</span>
                        <span class="mobile-user-caret">▾</span>
                    </button>
                    <button type="button" class="mobile-menu-toggle-btn" id="mobile-menu-toggle-btn" aria-label="Menü öffnen" title="Menü ein-/ausklappen">
                        <span class="hamburger-icon">☰</span>
                    </button>
                </div>
            </div>

            <!-- Mobile Menübalken: Clean, Tappable Bar for Section Switching -->
            <div class="mobile-menubalken" id="mobile-menubalken-trigger" role="button" tabindex="0" aria-label="Menü ein- und ausklappen" aria-expanded="false">
                <div class="menubalken-left">
                    <span class="menubalken-bars-icon">☰</span>
                    <span class="menubalken-prefix">Menü:</span>
                    <span class="menubalken-active-title" id="menubalken-active-name">📊 Dashboard</span>
                </div>
                <div class="menubalken-right">
                    <span class="menubalken-hint">Abteil wählen</span>
                    <span class="menubalken-arrow" id="menubalken-arrow">▾</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section-label">MENU</div>
                <button class="sidebar-nav-link active" data-tab="dashboard">
                    <span class="nav-icon">📊</span>
                    <span class="nav-title">Dashboard</span>
                </button>
                <button class="sidebar-nav-link" data-tab="tasks">
                    <span class="nav-icon">📌</span>
                    <span class="nav-title">Aufgaben & To-Dos</span>
                    <span class="nav-counter-pill" id="sidebar-task-counter">12+</span>
                </button>

                <div class="nav-section-label mt-3" id="sidebar-protected-label">GESCHÜTZTER BEREICH</div>
                <div id="sidebar-protected-nav">
                    <button class="sidebar-nav-link" data-tab="vault-login">
                        <span class="nav-icon">🔒</span>
                        <span class="nav-title">Geschützter Bereich</span>
                    </button>
                </div>

                <div class="nav-section-label mt-3">GENERAL</div>
                <button class="sidebar-nav-link" data-tab="settings">
                    <span class="nav-icon">⚙️</span>
                    <span class="nav-title">Einstellungen</span>
                </button>

                <!-- Mobile Drawer Only: System & Actions Section -->
                <div class="mobile-drawer-system-section mt-3">
                    <div class="nav-section-label">SYSTEM & AKTIONEN</div>
                    <div class="mobile-drawer-sync-badge mb-2">
                        <span class="sync-dot">🟢</span>
                        <span class="sync-text">Cloud-Sync aktiv (Echtzeit)</span>
                    </div>
                    <div class="mobile-drawer-action-list d-flex flex-column gap-1.5">
                        <button type="button" class="sidebar-nav-link" id="mobile-export-backup-btn">
                            <span class="nav-icon">📄</span>
                            <span class="nav-title">PDF / Backup</span>
                        </button>
                        <button type="button" class="sidebar-nav-link" id="mobile-lock-app-btn">
                            <span class="nav-icon">🚪</span>
                            <span class="nav-title">Abmelden</span>
                        </button>
                    </div>
                </div>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <div class="app-main-wrapper">
            <!-- Top Action Bar with Real-Time User Badge and Actions -->
            <header class="topbar-header">
                <div class="topbar-left">
                    <h2 class="view-title" id="page-view-title">📊 Vorstands-Dashboard & Übersicht</h2>
                </div>

                <div class="topbar-right">
                    <!-- Dynamic Auto-Save & Cloud Sync Status Badge -->
                    <div id="autosave-status-badge" class="autosave-badge autosave-clean" title="Live mit allen Geräten synchronisiert. Keine Daten gehen verloren.">
                        <span>🟢</span> <span>Cloud-Sync aktiv</span>
                    </div>

                    <!-- Logged-in User Profile Badge (Derived from active authenticated session) -->
                    <div class="logged-in-user-badge" id="logged-in-user-badge" style="display: flex; align-items: center; gap: 0.6rem; background: var(--bg-canvas); border: 1px solid var(--border-medium); padding: 0.35rem 0.85rem; border-radius: 12px; user-select: none;">
                        <span id="current-user-avatar" style="font-size: 1.15rem; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; background: #ffffff; border: 1px solid var(--border-subtle); border-radius: 50%; overflow: hidden;">👨‍💻</span>
                        <div style="display: flex; flex-direction: column; text-align: left; line-height: 1.15;">
                            <span id="current-user-name" style="font-size: 0.85rem; font-weight: 800; color: var(--text-primary); white-space: nowrap;">Moritz Kubik</span>
                            <span id="current-user-role" style="font-size: 0.72rem; font-weight: 700; color: #16a34a; white-space: nowrap;">👑 Superuser</span>
                        </div>
                    </div>

                    <div class="topbar-action-buttons">
                        <button class="btn btn-sm btn-ghost" id="export-backup-btn" title="PDF-Übersicht anzeigen & Backup herunterladen">📄 PDF / Backup</button>
                        <button class="btn btn-sm btn-ghost" id="lock-app-btn" title="Von der Vorstands-Zentrale abmelden">🚪 Abmelden</button>
                    </div>
                </div>
            </header>

            <!-- Main View Viewport -->
            <main class="main-container" id="main-content-view">
                <!-- Injected via JavaScript Modules -->
            </main>
        </div>
    </div>

    <!-- External Client-side PDF Generation Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <!-- Application Script Engine -->
    <script type="module" src="js/app.js?v=54.2"></script>
</body>
</html>
