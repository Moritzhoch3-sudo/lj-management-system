<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landjugend Scheuring | Vorstands-Zentrale</title>
    <meta name="description" content="Zentrales Verwaltungssystem für die Vorstandschaft der Landjugend Scheuring. Aufgaben-Verwaltung, Personen-Dashboard mit Prozentanzeigen, PIN-geschütztes Kassenbuch, Verträge & Audio-Sitzungstranskription.">
    
    <!-- Security Meta Tags -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    
    <!-- Google Fonts: Plus Jakarta Sans & Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    
    <!-- Stylesheets with Clean Spacing v14.0 Cache-Buster Query Tags -->
    <link rel="stylesheet" href="css/main.css?v=14.0">
    <link rel="stylesheet" href="css/components.css?v=14.0">
</head>
<body class="theme-nextgen">
    <div class="app-layout">
        <!-- Modern Left Sidebar Navigation -->
        <aside class="app-sidebar">
            <div class="sidebar-header">
                <div class="brand-logo">
                    <img src="assets/logo.svg" alt="Landjugend Scheuring Logo" class="brand-logo-img" />
                    <div class="brand-text">
                        <h1 class="font-logo-heading">Vorstands-Zentrale</h1>
                        <span class="brand-sub">Landjugend Scheuring</span>
                    </div>
                </div>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section-label">HAUPTMENÜ</div>
                <button class="sidebar-nav-link active" data-tab="dashboard">
                    <span class="nav-icon">📊</span>
                    <span class="nav-title">Dashboard</span>
                </button>
                <button class="sidebar-nav-link" data-tab="tasks">
                    <span class="nav-icon">📌</span>
                    <span class="nav-title">Aufgaben & To-Dos</span>
                </button>

                <div class="nav-section-label mt-4">GESCHÜTZTER BEREICH</div>
                <button class="sidebar-nav-link" data-tab="finance">
                    <span class="nav-icon">💰</span>
                    <span class="nav-title">Finanzen 🔒</span>
                </button>
                <button class="sidebar-nav-link" data-tab="contracts">
                    <span class="nav-icon">📄</span>
                    <span class="nav-title">Verträge 🔒</span>
                </button>
                <button class="sidebar-nav-link" data-tab="minutes">
                    <span class="nav-icon">🎙️</span>
                    <span class="nav-title">Sitzungen & Audio 🔒</span>
                </button>

                <div class="nav-section-label mt-4">SYSTEM</div>
                <button class="sidebar-nav-link" data-tab="settings">
                    <span class="nav-icon">⚙️</span>
                    <span class="nav-title">Einstellungen</span>
                </button>
            </nav>

            <!-- Sidebar Footer User Profile Card -->
            <div class="sidebar-footer">
                <div class="sidebar-user-chip">
                    <span class="user-avatar-badge" id="sidebar-user-avatar">👤</span>
                    <div class="user-info-text">
                        <span class="user-name" id="sidebar-user-name">Vorstandsmitglied</span>
                        <span class="user-role" id="sidebar-user-role">Landjugend Scheuring</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <div class="app-main-wrapper">
            <!-- Top Action Bar -->
            <header class="topbar-header">
                <div class="topbar-left">
                    <h2 class="view-title" id="page-view-title">📊 Dashboard Overview</h2>
                </div>

                <div class="topbar-right">
                    <!-- User Selector -->
                    <div class="user-simulator-box">
                        <label for="user-simulator-select">Angemeldet als:</label>
                        <select id="user-simulator-select" class="form-select form-select-sm"></select>
                    </div>

                    <button class="btn btn-sm btn-ghost" id="export-backup-btn" title="Backup herunterladen">💾 Backup</button>
                    <button class="btn btn-sm btn-ghost danger-text" id="reset-data-btn" title="Auf Standarddaten zurücksetzen">🔄 Reset</button>
                </div>
            </header>

            <!-- Main View Viewport -->
            <main class="main-container" id="main-content-view">
                <!-- Injected via JavaScript Modules -->
            </main>
        </div>
    </div>

    <!-- Application Script Engine -->
    <script type="module" src="js/app.js?v=14.0"></script>
</body>
</html>
