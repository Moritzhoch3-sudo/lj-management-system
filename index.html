<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landjugend Scheuring | Vorstands-Zentrale</title>
    <meta name="description" content="Zentrales Verwaltungssystem für die Vorstandschaft der Landjugend Scheuring. Aufgaben-Verwaltung, Personen-Dashboard mit Prozentanzeigen, PIN-geschütztes Kassenbuch, Verträge & Audio-Sitzungstranskription.">
    
    <!-- Google Fonts: Montserrat (Headings like Logo) & Inter (Body Text) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    
    <!-- Stylesheets with Mobile Responsive v4.0 Cache-Buster Query Tags -->
    <link rel="stylesheet" href="css/main.css?v=4.0">
    <link rel="stylesheet" href="css/components.css?v=4.0">
</head>
<body>
    <!-- App Header & Navigation -->
    <header class="app-header">
        <div class="header-container">
            <!-- Refined Landjugend Scheuring Logo -->
            <div class="brand-logo">
                <img src="assets/logo.svg" alt="Landjugend Scheuring Logo" class="brand-logo-img" />
                <div class="brand-text">
                    <h1 class="font-logo-heading">Vorstands-Zentrale</h1>
                    <span class="brand-sub">Landjugend Scheuring</span>
                </div>
            </div>

            <!-- Navigation Tabs (Mobile Horizontally Scrollable) -->
            <nav class="nav-menu">
                <button class="nav-link active" data-tab="tasks">
                    <span>✅</span> Aufgaben
                </button>
                <button class="nav-link" data-tab="dashboard">
                    <span>📊</span> Dashboard (% Overview)
                </button>
                <button class="nav-link" data-tab="finance">
                    <span>💰</span> Finanzen 🔒
                </button>
                <button class="nav-link" data-tab="contracts">
                    <span>📋</span> Verträge 🔒
                </button>
                <button class="nav-link" data-tab="minutes">
                    <span>🎙️</span> Sitzungen & Audio 🔒
                </button>
                <button class="nav-link" data-tab="settings">
                    <span>⚙️</span> Einstellungen
                </button>
                <button class="nav-link" data-tab="password">
                    <span>🔑</span> Passwort ändern
                </button>
            </nav>

            <!-- User Simulator & Actions -->
            <div class="header-actions">
                <div id="cloud-sync-badge" class="cloud-sync-badge status-connecting">🔄 verbinde Cloud...</div>
                <div class="user-simulator-box">
                    <label for="user-simulator-select">Angemeldet als:</label>
                    <select id="user-simulator-select" class="form-select form-select-sm"></select>
                </div>
                <button class="btn btn-sm btn-emerald text-nowrap" id="export-excel-btn" title="Dashboard als Excel-Datei herunterladen">📊 Export Excel</button>
            </div>
        </div>
    </header>

    <!-- Main View Viewport -->
    <main class="main-container" id="main-content-view">
        <!-- Injected via JavaScript Modules -->
    </main>

    <!-- Application Script Engine -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
